name: Build and deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    # Runs on your own machine (self-hosted runner) rather than a GitHub-hosted
    # one, because SiteGround appears to block/drop SSH connections from
    # GitHub-hosted runners' datacenter IP ranges before the handshake even
    # completes. Your machine's normal IP already reaches SiteGround fine.
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 11ty does not clean stale output between builds, and CI runners are
      # single-purpose/ephemeral anyway, so this is mostly a safety net.
      - name: Clean build
        run: |
          rm -rf _site
          npx @11ty/eleventy

      # Guard against the exact failure mode that broke image URLs on a past
      # manual FTP deploy: a stray `eleventy --serve` process racing with the
      # build and leaking dev-server-only image URLs into the shipped HTML.
      # A fresh CI runner can't have a stray process, but this keeps the
      # check in place in case the plugin's serve-mode detection misfires.
      - name: Guard against dev-only image URLs leaking into the build
        run: |
          if grep -rl '\.11ty/image' _site; then
            echo "::error::Build output references the Eleventy dev-server image endpoint instead of static /img/ files. Aborting deploy."
            exit 1
          fi

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SITEGROUND_SSH_KEY }}

      - name: Trust SiteGround host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SITEGROUND_SSH_PORT }}" "${{ secrets.SITEGROUND_SSH_HOST }}" >> ~/.ssh/known_hosts

      # No --delete: files removed locally are left in place remotely rather
      # than being destructively removed. Add --delete once you've confirmed
      # SITEGROUND_REMOTE_PATH points at a directory containing *only* this
      # site's build output.
      - name: Deploy over SSH (rsync)
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.SITEGROUND_SSH_PORT }}" \
            _site/ \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:${{ secrets.SITEGROUND_REMOTE_PATH }}"
