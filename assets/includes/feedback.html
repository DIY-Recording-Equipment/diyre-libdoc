<form action="https://formsubmit.co/support@diyrecordingequipment.com" method="POST" id="form-contact">
    <input type="hidden" name="_subject" value="%meta.title% Feedback">
    <input type="hidden" name="_replyto">
    <input type="hidden" name="_next" value="https://manuals.diy.re/docs/contact/thanks/">
    <p><input type="text" name="name" placeholder="Your Name"></p>
    <p><input type="text" name="email" placeholder="Your Email"></p>

<p>
    <label>How long did it take you to build this kit?</label><br><input type="text" name="time" placeholder="30 minutes? 3 hours?"></p>
<p>
    <label>What could we improve?</label><br><textarea rows="15" cols="75" name="message" placeholder="Your feedback"></textarea></p>
<p>
    <button class="btn" type="submit" form="form-contact">Submit</button>
</p>
</form>
